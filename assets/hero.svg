<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Franco Alvarado — Process &amp; Automation Analyst</title>
  <desc id="d">Animated neon banner with Franco Alvarado's name, rotating roles (automation, AI agents, web apps, hardware) and a graphics card with spinning fans.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/>
      <stop offset="1" stop-color="#130F17"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#EF233C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EF233C">
        <animate attributeName="stop-color" values="#EF233C;#A78BFA;#8B5CF6;#EF233C" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#8B5CF6;#EF233C;#A78BFA" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F5F5F5"/>
      <stop offset="1" stop-color="#EF233C"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="420" rx="18"/></clipPath>
    <clipPath id="c0"><rect x="70" y="222" height="40" width="0"><animate attributeName="width" values="0;640;640;0;0" keyTimes="0;0.1;0.22;0.245;1" dur="12s" begin="0s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c1"><rect x="70" y="222" height="40" width="0"><animate attributeName="width" values="0;640;640;0;0" keyTimes="0;0.1;0.22;0.245;1" dur="12s" begin="3s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c2"><rect x="70" y="222" height="40" width="0"><animate attributeName="width" values="0;640;640;0;0" keyTimes="0;0.1;0.22;0.245;1" dur="12s" begin="6s" repeatCount="indefinite"/></rect></clipPath>
    <clipPath id="c3"><rect x="70" y="222" height="40" width="0"><animate attributeName="width" values="0;640;640;0;0" keyTimes="0;0.1;0.22;0.245;1" dur="12s" begin="9s" repeatCount="indefinite"/></rect></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
      .sans{font-family:'Segoe UI','Inter',Roboto,'Helvetica Neue',Arial,sans-serif}
      .trace{fill:none;stroke:#EF233C;stroke-opacity:.18;stroke-width:2}
      .pulse{fill:none;stroke:#FF4D5E;stroke-width:3;stroke-linecap:round;stroke-dasharray:28 900;animation:flow 5s linear infinite;filter:url(#neon)}
      .p2{animation-delay:-1.7s;stroke:#A78BFA}
      .p3{animation-delay:-3.1s}
      @keyframes flow{from{stroke-dashoffset:928}to{stroke-dashoffset:0}}
      .fan{transform-box:fill-box;transform-origin:center;animation:spin 1.1s linear infinite}
      .fan2{animation-duration:.9s}
      @keyframes spin{to{transform:rotate(360deg)}}
      .scan{animation:scan 6s linear infinite}
      @keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(440px)}}
      .blink{animation:blink 1s steps(1) infinite}
      @keyframes blink{50%{opacity:0}}
      .dot{animation:tw 3s ease-in-out infinite}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
      .flick{animation:flick 4s linear infinite}
      @keyframes flick{0%,92%,100%{opacity:1}93%{opacity:.35}95%{opacity:1}96%{opacity:.5}}
      .float{animation:float 5s ease-in-out infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>
    <rect width="1200" height="420" fill="url(#glow)"/>

    <!-- circuit traces -->
    <path class="trace" d="M0 385 H260 L300 350 H520 L560 385 H760"/>
    <path class="trace" d="M1200 60 H1000 L960 100 H780 L740 60 H560"/>
    <path class="trace" d="M640 420 V380 L680 340 H730"/>
    <path class="pulse" d="M0 385 H260 L300 350 H520 L560 385 H760"/>
    <path class="pulse p2" d="M1200 60 H1000 L960 100 H780 L740 60 H560"/>
    <path class="pulse p3" d="M640 420 V380 L680 340 H730"/>

    <!-- particles -->
    <circle class="dot" cx="610" cy="140" r="2" fill="#EF233C"/>
    <circle class="dot" cx="700" cy="250" r="2" fill="#A78BFA" style="animation-delay:-1s"/>
    <circle class="dot" cx="1150" cy="360" r="2" fill="#EF233C" style="animation-delay:-2s"/>
    <circle class="dot" cx="1120" cy="110" r="1.6" fill="#ffffff" style="animation-delay:-.5s"/>
    <circle class="dot" cx="560" cy="200" r="1.6" fill="#ffffff" style="animation-delay:-2.4s"/>

    <!-- text block -->
    <text x="70" y="108" class="mono" font-size="20" fill="#EF233C">&gt; hello_world<tspan class="blink">_</tspan></text>
    <text x="70" y="128" class="mono" font-size="14" fill="#8A8A8A">Hi, I'm</text>
    <text x="66" y="196" class="sans" font-size="64" font-weight="800" fill="url(#name)" filter="url(#neon)" letter-spacing="-1">Franco Alvarado</text>

    <g class="mono" font-size="24" fill="#FF4D5E">
      <g clip-path="url(#c0)"><text x="70" y="250">$ automation &amp; process analyst</text></g>
      <g clip-path="url(#c1)"><text x="70" y="250" fill="#A78BFA">$ orchestrating AI agents</text></g>
      <g clip-path="url(#c2)"><text x="70" y="250">$ web apps for real businesses</text></g>
      <g clip-path="url(#c3)"><text x="70" y="250" fill="#A78BFA">$ hardware &amp; PC tuning nerd</text></g>
    </g>

    <!-- tags -->
    <g class="mono" font-size="13" fill="#e5e5e5">
      <rect x="70" y="290" width="150" height="30" rx="15" fill="#EF233C" fill-opacity=".12" stroke="#EF233C" stroke-opacity=".5"/>
      <text x="145" y="310" text-anchor="middle">LIMA · PERU</text>
      <rect x="232" y="290" width="200" height="30" rx="15" fill="#EF233C" fill-opacity=".12" stroke="#EF233C" stroke-opacity=".5"/>
      <text x="332" y="310" text-anchor="middle">SYSTEMS ENG · UPC</text>
      <rect x="444" y="290" width="190" height="30" rx="15" fill="#A78BFA" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".5"/>
      <text x="539" y="310" text-anchor="middle" fill="#ddd6fe">AUTOMATION + AI</text>
    </g>

    <!-- graphics card -->
    <g class="float">
      <rect x="760" y="130" width="380" height="170" rx="14" fill="#151515" stroke="#2A2A2A" stroke-width="2"/>
      <rect x="760" y="130" width="380" height="8" rx="4" fill="url(#rgb)" filter="url(#neon)"/>
      <rect x="760" y="292" width="380" height="8" rx="4" fill="url(#rgb)" opacity=".7"/>
      <!-- fan 1 -->
      <circle cx="860" cy="215" r="68" fill="#0C0C0C" stroke="#EF233C" stroke-opacity=".55" stroke-width="2"/>
      <g class="fan">
        <circle cx="860" cy="215" r="62" fill="none"/>
        <path d="M860 215 C 870 180, 900 170, 912 190 C 895 192, 878 200, 860 215Z" fill="#2B1A1E"/>
        <path d="M860 215 C 895 225, 905 255, 885 268 C 882 250, 875 233, 860 215Z" fill="#2B1A1E"/>
        <path d="M860 215 C 850 250, 820 260, 808 240 C 825 238, 842 230, 860 215Z" fill="#2B1A1E"/>
        <path d="M860 215 C 825 205, 815 175, 835 162 C 838 180, 845 197, 860 215Z" fill="#2B1A1E"/>
        <path d="M860 215 C 880 190, 912 205, 920 225 C 900 220, 880 218, 860 215Z" fill="#3A2228" opacity=".7"/>
      </g>
      <circle cx="860" cy="215" r="14" fill="#151515" stroke="#EF233C" stroke-width="2"/>
      <!-- fan 2 -->
      <circle cx="1040" cy="215" r="68" fill="#0C0C0C" stroke="#A78BFA" stroke-opacity=".5" stroke-width="2"/>
      <g class="fan fan2">
        <circle cx="1040" cy="215" r="62" fill="none"/>
        <path d="M1040 215 C 1050 180, 1080 170, 1092 190 C 1075 192, 1058 200, 1040 215Z" fill="#221C2E"/>
        <path d="M1040 215 C 1075 225, 1085 255, 1065 268 C 1062 250, 1055 233, 1040 215Z" fill="#221C2E"/>
        <path d="M1040 215 C 1030 250, 1000 260, 988 240 C 1005 238, 1022 230, 1040 215Z" fill="#221C2E"/>
        <path d="M1040 215 C 1005 205, 995 175, 1015 162 C 1018 180, 1025 197, 1040 215Z" fill="#221C2E"/>
        <path d="M1040 215 C 1060 190, 1092 205, 1100 225 C 1080 220, 1060 218, 1040 215Z" fill="#2E2540" opacity=".7"/>
      </g>
      <circle cx="1040" cy="215" r="14" fill="#151515" stroke="#A78BFA" stroke-width="2"/>
      <text x="1140" y="320" text-anchor="end" class="mono" font-size="12" fill="#EF233C" letter-spacing="3">GPU · RTX 5070</text>
      <!-- pcie fingers -->
      <g fill="#c9a640" opacity=".8">
        <rect x="800" y="300" width="6" height="12"/><rect x="812" y="300" width="6" height="12"/><rect x="824" y="300" width="6" height="12"/><rect x="836" y="300" width="6" height="12"/><rect x="848" y="300" width="6" height="12"/><rect x="860" y="300" width="6" height="12"/><rect x="872" y="300" width="6" height="12"/><rect x="884" y="300" width="6" height="12"/><rect x="896" y="300" width="6" height="12"/><rect x="908" y="300" width="6" height="12"/>
      </g>
    </g>

    <!-- HUD strip -->
    <g class="mono" font-size="13" fill="#8A8A8A">
      <text x="760" y="360">FPS <tspan fill="#FF4D5E">240</tspan>  ·  LATENCY <tspan fill="#FF4D5E">2ms</tspan>  ·  MANUAL TASKS <tspan fill="#A78BFA">→ 0</tspan></text>
    </g>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="2" fill="#FF4D5E" opacity=".12"/>
    <rect x="1" y="1" width="1198" height="418" rx="17" fill="none" stroke="#EF233C" stroke-opacity=".35" stroke-width="2"/>
  </g>
</svg>
