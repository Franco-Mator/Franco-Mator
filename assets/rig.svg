<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t">
  <title id="t">Battle station: NVIDIA GeForce RTX 5070, AMD Ryzen 7 9700X, 32 GB DDR5 6000 MHz, 27 inch 1440p 240 Hz monitor, Razer Viper V2 Pro, AULA 68HE keyboard, Razer BlackShark V2 Pro. Main game: Valorant, entry fragger.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#130F17"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EF233C" stop-opacity=".35"/><stop offset="1" stop-color="#EF233C" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/></pattern>
    <filter id="neon" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="g"><rect x="780" y="100" width="380" height="120" rx="6"/></clipPath>
    <style>
      .mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
      .k{font-size:15px;font-weight:700;letter-spacing:2px}
      .v{font-size:16px;fill:#EDEDED}
      .scroll{animation:sc 4s linear infinite}
      @keyframes sc{to{transform:translateX(-400px)}}
      .blink{animation:bl 1.2s steps(1) infinite}
      @keyframes bl{50%{opacity:.2}}
      .f1,.f2,.f3{opacity:0;animation:fp 1.5s steps(1) infinite}
      .f2{animation-delay:.5s}.f3{animation-delay:1s}
      @keyframes fp{0%{opacity:1}33.3%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="330" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="328" rx="17" fill="none" stroke="#EF233C" stroke-opacity=".3" stroke-width="2"/>

  <text x="40" y="52" class="mono" font-size="18" font-weight="700" fill="#FF4D5E">BATTLE_STATION<tspan fill="#8A8A8A">.exe</tspan></text>
  <circle class="blink" cx="262" cy="46" r="5" fill="#ff3b3b"/><text x="274" y="51" class="mono" font-size="12" fill="#FF8A95" letter-spacing="2">LIVE</text>
  <rect x="40" y="66" width="670" height="1" fill="#EF233C" fill-opacity=".35"/>
  
    <text x="40" y="110" class="mono k" fill="#EF233C">GPU</text>
    <text x="100" y="110" class="mono v">NVIDIA GeForce RTX 5070</text>
    <rect x="410" y="98" width="300" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>
    <rect x="410" y="98" width="200" height="12" rx="6" fill="#EF233C" filter="url(#neon)"><animate attributeName="width" values="186;291;264;297;222;186" dur="4.2s" repeatCount="indefinite"/></rect>
    <text x="40" y="154" class="mono k" fill="#A78BFA">CPU</text>
    <text x="100" y="154" class="mono v">AMD Ryzen 7 9700X</text>
    <rect x="410" y="142" width="300" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>
    <rect x="410" y="142" width="200" height="12" rx="6" fill="#A78BFA" filter="url(#neon)"><animate attributeName="width" values="114;183;135;210;156;114" dur="3.6s" repeatCount="indefinite"/></rect>
    <text x="40" y="198" class="mono k" fill="#8B5CF6">RAM</text>
    <text x="100" y="198" class="mono v">32 GB DDR5 · 6000 MHz</text>
    <rect x="410" y="186" width="300" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>
    <rect x="410" y="186" width="200" height="12" rx="6" fill="#8B5CF6" filter="url(#neon)"><animate attributeName="width" values="162;174;183;170;165;162" dur="5s" repeatCount="indefinite"/></rect>
    <text x="40" y="242" class="mono k" fill="#D4D4D4">DSP</text>
    <text x="100" y="242" class="mono v">27" 1440p · 240 Hz IPS</text>
    <rect x="410" y="230" width="300" height="12" rx="6" fill="#ffffff" fill-opacity=".06"/>
    <rect x="410" y="230" width="200" height="12" rx="6" fill="#D4D4D4" filter="url(#neon)"><animate attributeName="width" values="300;300" dur="1s" repeatCount="indefinite"/></rect>
  <text x="40" y="286" class="mono" font-size="14" fill="#8A8A8A">PERIPHERALS <tspan fill="#D4D4D4">Razer Viper V2 Pro · AULA 68HE · Razer BlackShark V2 Pro</tspan></text>

  <!-- fps panel -->
  <rect x="770" y="40" width="400" height="250" rx="12" fill="#0C0C0C" stroke="#EF233C" stroke-opacity=".35"/>
  <text x="790" y="72" class="mono" font-size="13" fill="#8A8A8A" letter-spacing="2">FRAMETIME · VALORANT</text>
  <g class="mono" font-size="34" font-weight="800" fill="#FF4D5E" filter="url(#neon)">
    <text class="f1" x="1150" y="80" text-anchor="end">240</text>
    <text class="f2" x="1150" y="80" text-anchor="end">238</text>
    <text class="f3" x="1150" y="80" text-anchor="end">241</text>
  </g>
  <text x="1150" y="96" class="mono" font-size="11" fill="#8A8A8A" text-anchor="end" letter-spacing="2">FPS</text>
  <g clip-path="url(#g)">
    <g transform="translate(780 150)">
      <g class="scroll">
        <polygon points="0,16 20,12 40,12 60,8 80,16 100,4 120,24 140,4 160,36 180,8 200,20 220,32 240,8 260,16 280,0 300,0 320,16 340,20 360,16 380,4 400,16 420,12 440,12 460,8 480,16 500,4 520,24 540,4 560,36 580,8 600,20 620,32 640,8 660,16 680,0 700,0 720,16 740,20 760,16 780,4 800,16 820,12 840,12 860,8 880,16 900,4 920,24 940,4 960,36 980,8 1000,20 1020,32 1040,8 1060,16 1080,0 1100,0 1120,16 1140,20 1160,16 1180,4 1200,16 1200,80 0,80" fill="url(#area)"/>
        <polyline points="0,16 20,12 40,12 60,8 80,16 100,4 120,24 140,4 160,36 180,8 200,20 220,32 240,8 260,16 280,0 300,0 320,16 340,20 360,16 380,4 400,16 420,12 440,12 460,8 480,16 500,4 520,24 540,4 560,36 580,8 600,20 620,32 640,8 660,16 680,0 700,0 720,16 740,20 760,16 780,4 800,16 820,12 840,12 860,8 880,16 900,4 920,24 940,4 960,36 980,8 1000,20 1020,32 1040,8 1060,16 1080,0 1100,0 1120,16 1140,20 1160,16 1180,4 1200,16" fill="none" stroke="#FF4D5E" stroke-width="2.5" stroke-linejoin="round" filter="url(#neon)"/>
      </g>
    </g>
    <path d="M780 130H1160M780 170H1160M780 210H1160" stroke="#ffffff" stroke-opacity=".05"/>
  </g>
  <text x="790" y="248" class="mono" font-size="13" fill="#D4D4D4">MAIN <tspan fill="#A78BFA">Valorant</tspan> · ROLE <tspan fill="#A78BFA">entry fragger</tspan></text>
  <text x="790" y="272" class="mono" font-size="13" fill="#D4D4D4">ALSO <tspan fill="#FF4D5E">Cyberpunk 2077</tspan> · RT + path tracing</text>
</svg>
