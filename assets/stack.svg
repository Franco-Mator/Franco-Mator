<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t">
  <title id="t">Tech stack. Automation and AI: Power Automate, Copilot Studio, AI agents, Power Apps, Gen AI APIs, LangChain and RAG, Prompt engineering. Data and BI: Power BI, DAX, Power Query, SQL Server, SharePoint, Excel and VBA. Web and code: Python, TypeScript, Next.js and React, FastAPI, PostgreSQL, Supabase, Docker. Process: Lean Six Sigma, Scrum, BPMN AS-IS and TO-BE, Bizagi.</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0A"/><stop offset="1" stop-color="#130F17"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Consolas,'Courier New',monospace}
      .h{font-size:15px;font-weight:700;letter-spacing:3px}
      .chip{opacity:0;animation:in .5s ease-out forwards}
      .chip rect{fill-opacity:.08;stroke-opacity:.55;stroke-width:1.5}
      .chip text{font-size:15px;fill:#EDEDED}
      .chip rect{fill:#FFFFFF;stroke:#FFFFFF}
      .chip rect{fill-opacity:.03;stroke-opacity:.14}
      @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
      .bar{animation:grow 1.2s ease-out forwards;transform-box:fill-box;transform-origin:left;transform:scaleX(0)}
      @keyframes grow{to{transform:scaleX(1)}}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="400" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#EF233C" stroke-opacity=".3" stroke-width="2"/>

  <!-- column 1 -->
  <g class="mono">
    <circle class="pulse" cx="44" cy="44" r="5" fill="#EF233C" filter="url(#neon)"/>
    <text x="58" y="49" class="h" fill="#FF4D5E">AUTOMATION + AI</text>
    <rect class="bar" x="40" y="60" width="250" height="2" fill="#EF233C"/>
    <g class="chip g" style="animation-delay:.10s"><rect x="40" y="80" width="250" height="34" rx="8"/><text x="56" y="102">Power Automate</text></g>
    <g class="chip g" style="animation-delay:.18s"><rect x="40" y="122" width="250" height="34" rx="8"/><text x="56" y="144">Copilot Studio</text></g>
    <g class="chip g" style="animation-delay:.26s"><rect x="40" y="164" width="250" height="34" rx="8"/><text x="56" y="186">AI agent orchestration</text></g>
    <g class="chip g" style="animation-delay:.34s"><rect x="40" y="206" width="250" height="34" rx="8"/><text x="56" y="228">Power Apps</text></g>
    <g class="chip g" style="animation-delay:.42s"><rect x="40" y="248" width="250" height="34" rx="8"/><text x="56" y="270">Gen AI APIs</text></g>
    <g class="chip g" style="animation-delay:.50s"><rect x="40" y="290" width="250" height="34" rx="8"/><text x="56" y="312">LangChain · RAG</text></g>
    <g class="chip g" style="animation-delay:.58s"><rect x="40" y="332" width="250" height="34" rx="8"/><text x="56" y="354">Prompt engineering</text></g>
  </g>

  <!-- column 2 -->
  <g class="mono">
    <circle class="pulse" cx="334" cy="44" r="5" fill="#A78BFA" filter="url(#neon)" style="animation-delay:-.6s"/>
    <text x="348" y="49" class="h" fill="#A78BFA">DATA + BI</text>
    <rect class="bar" x="330" y="60" width="250" height="2" fill="#A78BFA" style="animation-delay:.15s"/>
    <g class="chip c" style="animation-delay:.30s"><rect x="330" y="80" width="250" height="34" rx="8"/><text x="346" y="102">Power BI</text></g>
    <g class="chip c" style="animation-delay:.38s"><rect x="330" y="122" width="250" height="34" rx="8"/><text x="346" y="144">DAX · Power Query</text></g>
    <g class="chip c" style="animation-delay:.46s"><rect x="330" y="164" width="250" height="34" rx="8"/><text x="346" y="186">SQL · SQL Server</text></g>
    <g class="chip c" style="animation-delay:.54s"><rect x="330" y="206" width="250" height="34" rx="8"/><text x="346" y="228">SharePoint Lists</text></g>
    <g class="chip c" style="animation-delay:.62s"><rect x="330" y="248" width="250" height="34" rx="8"/><text x="346" y="270">Excel · VBA</text></g>
    <g class="chip c" style="animation-delay:.70s"><rect x="330" y="290" width="250" height="34" rx="8"/><text x="346" y="312">Deep learning · SHAP</text></g>
  </g>

  <!-- column 3 -->
  <g class="mono">
    <circle class="pulse" cx="624" cy="44" r="5" fill="#8B5CF6" filter="url(#neon)" style="animation-delay:-1.2s"/>
    <text x="638" y="49" class="h" fill="#C4B5FD">WEB + CODE</text>
    <rect class="bar" x="620" y="60" width="250" height="2" fill="#8B5CF6" style="animation-delay:.3s"/>
    <g class="chip v" style="animation-delay:.50s"><rect x="620" y="80" width="250" height="34" rx="8"/><text x="636" y="102">Python</text></g>
    <g class="chip v" style="animation-delay:.58s"><rect x="620" y="122" width="250" height="34" rx="8"/><text x="636" y="144">TypeScript</text></g>
    <g class="chip v" style="animation-delay:.66s"><rect x="620" y="164" width="250" height="34" rx="8"/><text x="636" y="186">Next.js · React</text></g>
    <g class="chip v" style="animation-delay:.74s"><rect x="620" y="206" width="250" height="34" rx="8"/><text x="636" y="228">FastAPI</text></g>
    <g class="chip v" style="animation-delay:.82s"><rect x="620" y="248" width="250" height="34" rx="8"/><text x="636" y="270">PostgreSQL · Supabase</text></g>
    <g class="chip v" style="animation-delay:.90s"><rect x="620" y="290" width="250" height="34" rx="8"/><text x="636" y="312">Docker</text></g>
    <g class="chip v" style="animation-delay:.98s"><rect x="620" y="332" width="250" height="34" rx="8"/><text x="636" y="354">Tailwind CSS</text></g>
  </g>

  <!-- column 4 -->
  <g class="mono">
    <circle class="pulse" cx="914" cy="44" r="5" fill="#D4D4D4" filter="url(#neon)" style="animation-delay:-1.8s"/>
    <text x="928" y="49" class="h" fill="#E5E5E5">PROCESS</text>
    <rect class="bar" x="910" y="60" width="250" height="2" fill="#D4D4D4" style="animation-delay:.45s"/>
    <g class="chip o" style="animation-delay:.70s"><rect x="910" y="80" width="250" height="34" rx="8"/><text x="926" y="102">Lean Six Sigma</text></g>
    <g class="chip o" style="animation-delay:.78s"><rect x="910" y="122" width="250" height="34" rx="8"/><text x="926" y="144">Scrum Master</text></g>
    <g class="chip o" style="animation-delay:.86s"><rect x="910" y="164" width="250" height="34" rx="8"/><text x="926" y="186">BPMN · AS-IS / TO-BE</text></g>
    <g class="chip o" style="animation-delay:.94s"><rect x="910" y="206" width="250" height="34" rx="8"/><text x="926" y="228">Bizagi Modeler</text></g>
    <g class="chip o" style="animation-delay:1.02s"><rect x="910" y="248" width="250" height="34" rx="8"/><text x="926" y="270">Project management</text></g>
  </g>
</svg>
