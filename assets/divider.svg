<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" role="img" aria-label="divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#76B900" stop-opacity="0"/>
      <stop offset=".5" stop-color="#9BFF2E"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <style>.m{animation:m 3.5s linear infinite}@keyframes m{from{transform:translateX(-400px)}to{transform:translateX(1200px)}}</style>
  </defs>
  <rect x="0" y="4" width="1200" height="2" fill="#76B900" fill-opacity=".2"/>
  <rect class="m" x="0" y="3" width="400" height="4" rx="2" fill="url(#g)"/>
</svg>
